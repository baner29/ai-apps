  - external_key: pm-metrics-tradeoff-11
    title: North Star vs Guardrail Metrics
    prompt: >-
      Your team tests a new home-feed ranking model aimed at increasing Weekly Active
      Retention (North Star). The experiment lifts clicks by +12%, but page load latency
      p95 increases by +400ms and "hide/not interested" feedback rises by +18%.
      Which decision best reflects sound product metric governance?
    format: mcq
    difficulty: easy
    tags:
      - product-management
      - analytics
      - strategy
    options:
      - Ship immediately to 100% because clicks increased significantly.
      - Treat latency p95 and negative feedback rate as breached guardrail metrics, hold full rollout, and iterate on model efficiency and relevance before re-testing.
      - Remove latency and hide-rate from the experiment scorecard to simplify stakeholder reporting.
      - Extend the experiment for 12 more months without changing the model to see if latency normalizes on its own.
    answer_indices:
      - 1
    default_points: 10
    expected_answer: >-
      Guardrail metrics protect long-term user trust and system health from short-term
      clickbait or performance regressions. When guardrails breach thresholds, hold full
      rollout, diagnose root causes, and optimize latency/quality before shipping.
    evaluation_rubric: >-
      10 pts for selecting option 1 (exact match).
    active: true

  - external_key: pm-launch-case-12
    title: B2B Self-Serve Onboarding Redesign
    prompt: |-
      You are the Product Manager for a B2B developer collaboration SaaS platform. Funnel analytics show that **40% of new workspaces drop off** between creating an account and inviting their first teammate within 7 days.

      Write a structured product strategy covering:
      1. **Diagnosis & Hypotheses:** How would you segment the drop-off (quantitative + qualitative) to isolate top root causes?
      2. **Prioritized Experiments:** Propose 3 concrete product interventions and explain how you would prioritize them (e.g., impact vs. effort / confidence).
      3. **Success & Guardrail Metrics:** Define your activation metric, leading indicators, and guardrails (e.g., spam invites, support ticket load).
      4. **Two-Quarter Roadmap & Rollout Plan:** Outline sequencing, A/B test design, and cross-functional dependencies.
    format: text
    difficulty: hard
    tags:
      - product-management
      - case-study
      - prioritization
    default_points: 30
    expected_answer: >-
      Segment funnel by acquisition channel, company size, SSO/email domain, and first-session
      actions; pair funnel cohorts with session replays and churned-user interviews to separate
      "single-player evaluators" from friction (e.g., empty-state confusion, permission/IT
      approval blockers, or missing sample project). Prioritize high-impact, low-friction
      experiments such as interactive starter templates to reach first value before prompting
      invites, contextual invite triggers on shareable artifacts, and frictionless domain-verified
      join links. Measure 7-day team activation (2+ active users completing a core action) with
      guardrails on invite acceptance rate, spam/unsubscribes, and 30-day workspace retention.
    evaluation_rubric: |-
      - 8 pts: Disciplined root-cause diagnosis combining quantitative segmentation and qualitative discovery
      - 8 pts: Concrete, non-generic product experiments with clear prioritization rationale
      - 7 pts: Well-defined activation metric plus meaningful guardrail metrics
      - 7 pts: Pragmatic 2-quarter rollout, experiment methodology, and cross-functional risk mitigation
    active: true
